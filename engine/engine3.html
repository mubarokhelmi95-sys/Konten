       text-shadow:0 2px 10px rgba(0,0,0,.55),0 0 3px rgba(0,0,0,.5);transform:translateY(-50%);white-space:nowrap}

       border:2px solid #fff;border-radius:6px;white-space:nowrap}

{ "imports": { "three": "/node_modules/three/build/three.module.js",
               "three/addons/": "/node_modules/three/examples/jsm/" } }

<body>
<div id="stage"><canvas id="cv"></canvas><div id="sub"></div><div id="labs"></div></div>
<script type="module">
/* ============================================================
   Engine three.js (PBR + GLB) untuk template MEN'S GIBRIG.
   Dipilih lewat scene.json: "meta": { "engine": "three" }
   Format scene.json sama dengan engine WebGL lama, ditambah:
     - objek GLB:   {"id":"hero","glb":"assets/orang.glb","fitHeight":1.75,"clips":[{"t":0,"name":"Idle"},{"t":3,"name":"Walk"}]}
     - kaca:        "glass": true  (transmisi, untuk botol)
     - bentuk putar:{"type":"lathe","profile":[[r,y],...]}
     - material:    "rough", "metal"
     - palette:     "hdri": "assets/langit.hdr", "exposure", "sunIntensity", "envIntensity"
     - meta.post:   {"ao":true,"bloom":true,"dof":{"aperture":0.0002,"maxblur":0.01}}
   ============================================================ */
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { Sky } from 'three/addons/objects/Sky.js';

const q = new URLSearchParams(location.search);
const PROJ = q.get('project') || 'projects/contoh3';
const W = +q.get('w') || 720, H = +q.get('h') || 1280;

async function run() {
  const stage = document.getElementById('stage');
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  const cv = document.getElementById('cv');
  const subEl = document.getElementById('sub');
  subEl.style.fontSize = (H * 0.037) + 'px'; subEl.style.top = (H * 0.645) + 'px';
  const labsEl = document.getElementById('labs');

  async function jget(u, optional) {
    const r = await fetch(u);
    if (!r.ok) { if (optional) return null; throw new Error(u + ' -> ' + r.status); }
    return r.json();
  }
  const ease = (k, t) => k === 'linear' ? t : t * t * (3 - 2 * t);
  const clamp01 = x => Math.min(1, Math.max(0, x));
  const lerp3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

  const scene = await jget('/' + PROJ + '/scene.json');
  const subsData = await jget('/' + PROJ + '/subs.json', true) || { cards: [], audio_duration: 0 };
  const meta = Object.assign({ fps: 30 }, scene.meta || {});
  const post = Object.assign({ ao: true, bloom: true, grade: true, dof: { aperture: 0.00012, maxblur: 0.006 } }, meta.post || {});
  const pal = Object.assign({
    skyHorizon: '#cfe0ee', sun: [-0.45, 0.75, 0.4], sunColor: '#fff2dc', sunIntensity: 2.6,
    envIntensity: 1, exposure: 0.6, saturation: 1.12, contrast: 1.06, vignette: 0.28, grain: 0.012, hemi: 0.35, hemiGround: '#6f7d4e', fogDensity: 0.004, turbidity: 4, rayleigh: 1.4, hdri: null,
  }, scene.palette || {});

  /* ---------- renderer ---------- */
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(W, H, false);
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = pal.exposure;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scn = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(45, W / H, 0.05, 2000);

  const sunDir = new THREE.Vector3(...pal.sun).normalize();
  const pmrem = new THREE.PMREMGenerator(renderer);
  if (pal.hdri) {
    const { RGBELoader } = await import('three/addons/loaders/RGBELoader.js');
    const tex = await new RGBELoader().loadAsync('/' + pal.hdri);
    tex.mapping = THREE.EquirectangularReflectionMapping;
    scn.background = tex; scn.environment = pmrem.fromEquirectangular(tex).texture;
  } else {
    const sky = new Sky(); sky.scale.setScalar(450000); sky.frustumCulled = false;
    const u = sky.material.uniforms;
    u.turbidity.value = pal.turbidity; u.rayleigh.value = pal.rayleigh;
    u.mieCoefficient.value = 0.005; u.mieDirectionalG.value = 0.8; u.sunPosition.value.copy(sunDir);
    scn.add(sky); scn.environment = pmrem.fromScene(sky).texture;
  }
  if ('environmentIntensity' in scn) scn.environmentIntensity = pal.envIntensity;
  scn.fog = new THREE.FogExp2(new THREE.Color(pal.skyHorizon), pal.fogDensity);

  const sun = new THREE.DirectionalLight(new THREE.Color(pal.sunColor), pal.sunIntensity);
  const ctr = new THREE.Vector3(...(meta.shadowCenter || [0, 0, 0]));
  sun.position.copy(ctr).addScaledVector(sunDir, 60); sun.target.position.copy(ctr);
  sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
  const ext = meta.shadowSize || 25, sc = sun.shadow.camera;
  sc.left = -ext; sc.right = ext; sc.top = ext; sc.bottom = -ext; sc.near = 1; sc.far = 160;
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
  scn.add(sun, sun.target);
  scn.add(new THREE.HemisphereLight(new THREE.Color(pal.skyHorizon), new THREE.Color(pal.hemiGround), pal.hemi));

  /* ---------- prefab ---------- */
  const prefabCache = {};
  async function prefab(name) {
    if (!prefabCache[name]) prefabCache[name] = await jget('/engine/prefabs/' + name + '.json');
    return prefabCache[name];
  }
  const objs = [];
  for (const o of scene.objects || []) {
    if (!o.prefab) { objs.push(Object.assign({}, o)); continue; }
    const pf = await prefab(o.prefab);
    const cols = Object.assign({}, pf.defaults, o.colors);
    objs.push({ id: o.id, type: 'group', pos: o.pos, rot: o.rot, size: o.size || [1, 1, 1], parent: o.parent, show: o.show });
    for (const p of pf.parts) {
      const c = typeof p.color === 'string' && p.color[0] === '$' ? cols[p.color.slice(1)] : p.color;
      objs.push(Object.assign({}, p, (o.parts || {})[p.id] || {},
        { id: o.id + '.' + p.id, parent: p.parent ? o.id + '.' + p.parent : o.id, color: c }));
    }
  }

  /* ---------- material + geometri ---------- */
  function textTex(o) {
    const c = document.createElement('canvas'); c.width = 512; c.height = 256;
    const x = c.getContext('2d'); x.fillStyle = o.color || '#ffffff'; x.fillRect(0, 0, 512, 256);
    x.fillStyle = o.textColor || '#111111'; x.textAlign = 'center'; x.textBaseline = 'middle';
    let fs = 120; const f = s => `700 ${s}px Poppins, system-ui, sans-serif`;
    x.font = f(fs); while (x.measureText(o.text).width > 470 && fs > 16) { fs -= 4; x.font = f(fs); }
    x.fillText(o.text, 256, 132);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
  }

  /* ---------- tekstur prosedural (grass/asphalt/concrete/rubber) ---------- */
  function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function valueNoise(cells, rnd) {
    const g = new Float32Array(cells * cells); for (let i = 0; i < g.length; i++) g[i] = rnd();
    return (u, v) => {
      const fx = u * cells, fy = v * cells, x0 = Math.floor(fx), y0 = Math.floor(fy), tx = fx - x0, ty = fy - y0;
      const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty), X0 = x0 % cells, X1 = (x0 + 1) % cells, Y0 = y0 % cells, Y1 = (y0 + 1) % cells;
      const a = g[Y0 * cells + X0], b = g[Y0 * cells + X1], c = g[Y1 * cells + X0], d = g[Y1 * cells + X1];
      return (a + (b - a) * sx) * (1 - sy) + (c + (d - c) * sx) * sy;
    };
  }
  const TEXP = {
    grass:    { cells: [6, 16, 48, 128], amp: [.35, .3, .2, .25], lo: .60, speck: 0,    bump: 1.6 },
    asphalt:  { cells: [8, 32, 96, 256], amp: [.15, .2, .3, .5],  lo: .55, speck: .045, bump: 1.0 },
    concrete: { cells: [4, 16, 64],      amp: [.3, .2, .15],      lo: .80, speck: .01,  bump: .6 },
    rubber:   { cells: [32, 96, 256],    amp: [.2, .3, .5],       lo: .72, speck: 0,    bump: .8 },
    noise:    { cells: [8, 32, 128],     amp: [.4, .3, .3],       lo: .75, speck: 0,    bump: .5 },
  };
  const texCache = {};
  function detailTex(kind) {
    if (texCache[kind]) return texCache[kind];
    const P = TEXP[kind] || TEXP.noise, N = 256, rnd = mulberry(kind.length * 7919 + kind.charCodeAt(0));
    const ns = P.cells.map(c => valueNoise(c, rnd)), asum = P.amp.reduce((a, b) => a + b, 0);
    const cvs = document.createElement('canvas'); cvs.width = cvs.height = N;
    const ctx = cvs.getContext('2d'), img = ctx.createImageData(N, N);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      let v = 0; for (let i = 0; i < ns.length; i++) v += ns[i](x / N, y / N) * P.amp[i];
      v = P.lo + (1 - P.lo) * (v / asum);
      if (P.speck && rnd() < P.speck) v = Math.min(1, v + .25);
      const k = (y * N + x) * 4, g = Math.round(v * 255); img.data[k] = img.data[k + 1] = img.data[k + 2] = g; img.data[k + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    const t = new THREE.CanvasTexture(cvs); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; t.colorSpace = THREE.SRGBColorSpace;
    return (texCache[kind] = t);
  }
  function applyTex(m, o) {
    const t = detailTex(o.tex).clone(); t.needsUpdate = true;
    const tile = o.tile || 2, sz = o.size || [1, 1, 1];
    const rep = o.repeat || (o.type === 'box' ? [Math.max(1, sz[0] / tile), Math.max(1, sz[2] / tile)] : [4, 2]);
    t.repeat.set(rep[0], rep[1]);
    m.map = t; m.bumpMap = t; m.bumpScale = (TEXP[o.tex] || TEXP.noise).bump;
  }
  function material(o) {
    if (o.glass) return new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(o.color || '#ffffff'), roughness: o.rough ?? 0.04, metalness: 0,
      transmission: 1, thickness: o.thickness ?? 0.02, ior: 1.5, side: THREE.DoubleSide });
    const m = new THREE.MeshStandardMaterial({ color: new THREE.Color(o.color || '#cccccc'), roughness: o.rough ?? 0.8, metalness: o.metal ?? 0 });
    if (o.text) { m.map = textTex(o); m.color.set('#ffffff'); }
    else if (o.tex) applyTex(m, o);
    return m;
  }
  function geometry(o) {
    if (o.type === 'box') return new THREE.BoxGeometry(1, 1, 1);
    if (o.type === 'sphere') return new THREE.SphereGeometry(0.5, 48, 32);
    if (o.type === 'cyl') return new THREE.CylinderGeometry(0.5, 0.5, 1, 48);
    if (o.type === 'lathe') return new THREE.LatheGeometry(o.profile.map(p => new THREE.Vector2(p[0], p[1])), 64);
    return null;
  }
  try { await document.fonts.load('700 40px Poppins'); } catch (e) {}

  const nodes = {}, mixers = [], idles = [], rigs = [];
  const loader = new GLTFLoader();
  for (const o of objs) {
    o.pos = o.pos || [0, 0, 0]; o.rot = o.rot || [0, 0, 0]; o.size = o.size || [1, 1, 1];
    o.base = { pos: o.pos.slice(), rot: o.rot.slice(), size: o.size.slice() };
    let node;
    const g = geometry(o);
    if (g) { node = new THREE.Mesh(g, material(o)); node.castShadow = true; node.receiveShadow = true; }
    else node = new THREE.Group();
    node.rotation.order = 'YXZ';
    nodes[o.id] = node;
    if (o.glb) {
      const gltf = await loader.loadAsync('/' + o.glb);
      const model = gltf.scene;
      const bones = [];
      model.traverse(c => {
        if (c.isBone) bones.push(c.name);
        if (c.isMesh) {
          c.castShadow = true; c.receiveShadow = true; c.frustumCulled = false;
          for (const mt of [].concat(c.material)) if (mt && o.doubleSide !== false) mt.side = THREE.DoubleSide;
        }
      });
      console.log('GLB', o.glb, 'tulang:', bones.length, bones.slice(0, 40).join(','));
      const B = {}; model.traverse(c => { if (c.isBone) B[c.name.replace(/[._\s]/g, '').toLowerCase()] = c; });
      if (B.head && B.upperarml && o.gesture !== false) rigs.push({ m: model, B, o, ph: rigs.length * 2.3 + 0.7 });
      let box = new THREE.Box3().setFromObject(model);
      if (o.fitHeight) { model.scale.multiplyScalar(o.fitHeight / (box.max.y - box.min.y || 1)); model.updateMatrixWorld(true); box = new THREE.Box3().setFromObject(model); }
      model.position.y -= box.min.y;
      if (o.center !== false) { model.position.x -= (box.min.x + box.max.x) / 2; model.position.z -= (box.min.z + box.max.z) / 2; }
      node.add(model);
      if (!gltf.animations.length && o.idle !== false) idles.push({ m: model, ph: idles.length * 1.7, s: model.scale.y, id: o.id });
      if (gltf.animations.length) {
        const clips = o.clips || [{ t: 0, name: o.clip || gltf.animations[0].name }];
        mixers.push({ mixer: new THREE.AnimationMixer(model), anims: gltf.animations, clips: clips.slice().sort((a, b) => a.t - b.t), speed: o.speed || 1, id: o.id });
        console.log('GLB', o.glb, 'animasi:', gltf.animations.map(a => a.name).join(', '));
      }
    }
  }
  for (const o of objs) (o.parent && nodes[o.parent] ? nodes[o.parent] : scn).add(nodes[o.id]);
  const byId = Object.fromEntries(objs.map(o => [o.id, o]));

  /* ---------- dekor: pohon & awan (opsional, lewat scene.decor) ---------- */
  function buildDecor(d) {
    if (!d) return;
    const DEG = Math.PI / 180;
    if (d.trees) {
      const c = d.trees, rnd = mulberry(c.seed || 7), n = c.count || 30, ct = c.center || [0, 0, 0];
      const [r0, r1] = c.radius || [16, 55], [a0, a1] = c.arc || [0, 360];
      const trunkG = new THREE.CylinderGeometry(0.16, 0.3, 1, 8), leafG = new THREE.IcosahedronGeometry(1, 2);
      const trunkM = new THREE.MeshStandardMaterial({ color: '#5b4030', roughness: 0.95 });
      const leafMs = (c.colors || ['#3f8f3a', '#4aa043', '#357f34', '#58b04a']).map(col => new THREE.MeshStandardMaterial({ color: col, roughness: 0.85 }));
      for (let i = 0; i < n; i++) {
        const ang = (a0 + (a1 - a0) * rnd()) * DEG, r = r0 + (r1 - r0) * rnd();
        const h = (4.5 + rnd() * 4.5) * (c.scale || 1), g = new THREE.Group();
        g.position.set(ct[0] + Math.cos(ang) * r, ct[1], ct[2] + Math.sin(ang) * r);
        const tr = new THREE.Mesh(trunkG, trunkM); tr.scale.set(h * 0.2, h * 0.6, h * 0.2); tr.position.y = h * 0.3;
        tr.castShadow = tr.receiveShadow = true; g.add(tr);
        const lm = leafMs[Math.floor(rnd() * leafMs.length)];
        for (let k = 0; k < 4; k++) {
          const b = new THREE.Mesh(leafG, lm), rr = h * (0.26 + rnd() * 0.1);
          b.scale.set(rr * 1.15, rr, rr * 1.15);
          b.position.set((rnd() - 0.5) * h * 0.35, h * (0.62 + k * 0.1), (rnd() - 0.5) * h * 0.35);
          b.castShadow = b.receiveShadow = true; g.add(b);
        }
        scn.add(g);
      }
    }
    if (d.clouds) {
      const cn = d.clouds, rnd = mulberry(99), cc = document.createElement('canvas'); cc.width = cc.height = 128;
      const x = cc.getContext('2d'), gr = x.createRadialGradient(64, 64, 4, 64, 64, 62);
      gr.addColorStop(0, 'rgba(255,255,255,.95)'); gr.addColorStop(.55, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = gr; x.fillRect(0, 0, 128, 128);
      const ct2 = new THREE.CanvasTexture(cc); ct2.colorSpace = THREE.SRGBColorSpace;
      const mat = new THREE.SpriteMaterial({ map: ct2, transparent: true, depthWrite: false, fog: false, toneMapped: false, color: 0xf4f4f4 });
      for (let i = 0; i < cn; i++) {
        const ang = rnd() * Math.PI * 2, dist = 350 + rnd() * 250, cx = Math.cos(ang) * dist, cz = Math.sin(ang) * dist, cy = 90 + rnd() * 90;
        for (let k = 0; k < 5; k++) {
          const sp = new THREE.Sprite(mat), w = 90 + rnd() * 90;
          sp.scale.set(w, w * 0.45, 1); sp.position.set(cx + (rnd() - .5) * 110, cy + (rnd() - .5) * 18, cz + (rnd() - .5) * 60); scn.add(sp);
        }
      }
    }
  }
  buildDecor(scene.decor || meta.decor);


  /* ---------- animasi ---------- */
  function applyTracks(t) {
    const cur = {};
    for (const o of objs) cur[o.id] = { pos: o.base.pos.slice(), rot: o.base.rot.slice(), size: o.base.size.slice() };
    for (const tr of scene.tracks || []) {
      const c = cur[tr.id]; if (!c) continue;
      for (const prop of ['pos', 'rot', 'size']) {
        const ks = tr.keys.filter(k => k[prop]); if (!ks.length) continue;
        if (t <= ks[0].t) { c[prop] = ks[0][prop].slice(); continue; }
        const last = ks[ks.length - 1];
        if (t >= last.t) { c[prop] = last[prop].slice(); continue; }
        for (let i = 0; i < ks.length - 1; i++) if (t >= ks[i].t && t < ks[i + 1].t) {
          c[prop] = lerp3(ks[i][prop], ks[i + 1][prop], ease(ks[i + 1].ease || tr.ease || 'inout', (t - ks[i].t) / (ks[i + 1].t - ks[i].t))); break; }
      }
    }
    const D = Math.PI / 180;
    for (const o of objs) {
      const n = nodes[o.id], c = cur[o.id];
      n.position.set(...c.pos); n.rotation.set(c.rot[0] * D, c.rot[1] * D, c.rot[2] * D); n.scale.set(...c.size);
      n.visible = !o.show || o.show.some(([a, b]) => t >= a && t < b);
    }
    for (const m of mixers) {
      let act = m.clips[0];
      for (const c of m.clips) if (c.t <= t) act = c;
      const want = (act.name || '').toLowerCase();
      const clip = m.anims.find(a => a.name.toLowerCase() === want) || m.anims.find(a => a.name.toLowerCase().includes(want)) || m.anims[0];
      m.mixer.stopAllAction(); const a = m.mixer.clipAction(clip); a.play();
      m.mixer.setTime(Math.max(0, t - act.t) * m.speed);
    }
    for (const rg of rigs) gesture(rg, t);
  }


  /* ---------- animasi prosedural untuk rig GLB (Idle asli hampir diam) ---------- */
  const _q = new THREE.Quaternion(), _r = new THREE.Quaternion(), _a = new THREE.Vector3();
  const AX = new THREE.Vector3(1, 0, 0), AY = new THREE.Vector3(0, 1, 0), AZ = new THREE.Vector3(0, 0, 1);
  function rotW(rig, bone, axis, ang) {            // putar di sumbu MODEL (X=kiri karakter, Y=atas, Z=depan)
    if (!bone || !ang) return;
    bone.parent.getWorldQuaternion(_q); rig.m.getWorldQuaternion(_r);
    _a.copy(axis).applyQuaternion(_r).applyQuaternion(_q.invert());
    bone.quaternion.premultiply(_r.setFromAxisAngle(_a, ang));
  }
  function speakEnv(o, t) {
    let ranges = o.speaks;
    if (ranges === true) ranges = (subsData.cards || []).map(k => [k.t0, k.t1]);
    if (!Array.isArray(ranges)) return 0;
    let e = 0; for (const [a, b] of ranges) e = Math.max(e, clamp01((t - a) / 0.25) * clamp01((b - t) / 0.25));
    return e * e * (3 - 2 * e);
  }
  function gesture(rig, t) {
    const { B, o, ph } = rig, g = o.gesture === undefined || o.gesture === true ? 1 : +o.gesture, s = speakEnv(o, t), T = Math.PI * 2;
    const sw = Math.sin(t * T * 0.21 + ph), br = Math.sin(t * T * 0.28 + ph);
    // hidup terus (napas, geser berat badan, kepala menengok pelan)
    rotW(rig, B.spine, AZ, sw * 0.018 * g); rotW(rig, B.spine, AX, br * 0.012 * g);
    rotW(rig, B.chest, AX, br * 0.016 * g);
    rotW(rig, B.neck, AY, Math.sin(t * T * 0.13 + ph * 1.3) * 0.07 * g);
    rotW(rig, B.head, AY, Math.sin(t * T * 0.17 + ph) * 0.09 * g); rotW(rig, B.head, AX, Math.sin(t * T * 0.23 + ph) * 0.025 * g);
    rotW(rig, B.upperarml, AZ, 0.05 * g + br * 0.01); rotW(rig, B.upperarmr, AZ, -0.05 * g - br * 0.01);
    if (s > 0) {                                    // lagi bicara: angguk + tangan bergerak
      const beat = Math.sin(t * T * 1.5 + ph), slow = 0.55 + 0.45 * Math.sin(t * T * 0.62 + ph);
      rotW(rig, B.head, AX, (0.05 + 0.05 * beat) * s * g); rotW(rig, B.head, AY, Math
